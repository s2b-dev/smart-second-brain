name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Format, lint, types, tests, build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Same rules as `bun run format` / `bun run lint`, without writing.
            # (Deliberately not `biome ci`: that also enforces import ordering,
            # which neither local command applies.)
            - name: Biome format check
              run: bunx biome format ./src ./test ./integration

            - name: Biome lint check
              run: bunx biome lint ./src ./test ./integration

            - name: Type check (src + tests)
              run: bun run check

            - name: Unit tests
              run: bun run test

            - name: Production build
              run: bun run build
