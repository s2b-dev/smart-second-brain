name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        # Publishing a draft from the GitHub UI while it still carries the
        # placeholder name creates a real `untagged-<hash>` tag, which would
        # re-trigger this workflow and fail on "tag_name already exists"
        # (2.1.1). Those pushes are never a release; skip them outright.
        if: ${{ !startsWith(github.ref_name, 'untagged-') }}
        runs-on: ubuntu-latest
        # One run per tag at a time: two pushes of the same tag could otherwise both
        # find no release and each create a draft. Queued, never cancelled, so the
        # last push's build is the one that ends up on the draft.
        concurrency:
            group: release-${{ github.ref }}
            cancel-in-progress: false
        permissions:
            contents: write
            # Required by attest-build-provenance to mint the signing certificate.
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            # CHANGELOG.md is the single source of release notes: the plugin bundles
            # it for its "What's new" tab, and its `## <tag> (date)` section becomes the
            # release body here. A stable tag without a section fails before the
            # build, since that version would otherwise ship with nothing to show
            # after an update. Pre-release tags (`2.3.0-beta.1`) need none.
            - name: Extract release notes
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  if [[ "$tag" == *-* ]]; then
                    : > release-notes.md
                  else
                    # Same heading shape the plugin's parser accepts (utils/releaseNotes.ts), so a
                    # mistyped date fails here instead of shipping notes the plugin can't find.
                    # ENVIRON, not -v: awk -v would eat the regex's backslashes.
                    pattern="^## ${tag//./\\.}( \\([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\\))?[[:space:]]*\$" \
                      awk '$0 ~ ENVIRON["pattern"] { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > release-notes.md
                    if ! grep -q '[^[:space:]]' release-notes.md; then
                      echo "::error::CHANGELOG.md has no '## $tag' section; write the release notes there before tagging."
                      exit 1
                    fi
                  fi

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build plugin
              run: bun run build

            # Signed provenance for the two built artifacts, so users can verify
            # they came from this repo and workflow rather than a hand-built
            # bundle:  gh attestation verify main.js --repo s2b-dev/smart-second-brain
            # manifest.json is committed source, not a build output, so it is
            # not attested — git history is already its provenance.
            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
              with:
                  subject-path: |
                      build/prod/main.js
                      build/prod/styles.css

            # The release is created as a draft, with the notes extracted above, so
            # the maintainer can review and publish it by hand. Fix wording in
            # CHANGELOG.md rather than in a stable draft: a re-run rewrites its body
            # (a pre-release draft's hand-written body is left alone). If a DRAFT
            # for the tag already exists (a re-run, or a tag re-pointed before publishing),
            # replace its assets in place: `gh release create` would either fail
            # on the existing tag or silently mint a second draft that only shows
            # up via the API. A PUBLISHED release is never touched — users may
            # already have installed its bundle — so that case fails loudly, and
            # a draft that gets published mid-upload is detected afterwards.
            # GitHub's `releases/tags/<tag>` endpoint never returns DRAFTS, so the
            # release is found by listing and then addressed by id (2.3.0: a
            # re-pointed tag minted a second draft because the tag lookup 404'd). A failed
            # listing (auth, rate limit, outage) fails the run rather than creating.
            - name: Create or update draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  assets=(build/prod/main.js manifest.json build/prod/styles.css)
                  api="repos/${GITHUB_REPOSITORY}/releases"

                  # The tag goes to jq as data (--arg), never into the filter text.
                  matches=$(gh api --paginate "$api" | jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag) | {id, draft}')
                  count=$(jq -s length <<<"$matches")

                  if [ "$count" -eq 0 ]; then
                    gh release create "$tag" \
                      --title="$tag" \
                      --draft \
                      --notes-file release-notes.md \
                      "${assets[@]}"
                  elif [ "$count" -gt 1 ]; then
                    echo "::error::$count releases exist for $tag; delete the stray ones and re-run."
                    exit 1
                  else
                    id=$(jq -r .id <<<"$matches")
                    if [ "$(jq -r .draft <<<"$matches")" != "true" ]; then
                      echo "::error::Release $tag is already published; refusing to replace its assets."
                      exit 1
                    fi
                    echo "Draft release $tag ($id) exists; replacing its assets and notes."
                    if [ -s release-notes.md ]; then
                      # tag_name must be restated: a PATCH without it silently renames
                      # a draft's tag to `untagged-<hash>`, detaching it from the tag.
                      gh api -X PATCH "$api/$id" -f tag_name="$tag" -F body=@release-notes.md >/dev/null
                    fi
                    # By id, not `gh release upload <tag>`: gh's tag lookup misses
                    # drafts too. Delete a same-named asset, then upload its build.
                    for file in "${assets[@]}"; do
                      name=$(basename "$file")
                      old=$(gh api --paginate "$api/$id/assets" | jq --arg name "$name" '.[] | select(.name == $name) | .id')
                      if [ -n "$old" ]; then gh api -X DELETE "$api/assets/$old"; fi
                      gh api -X POST "https://uploads.github.com/$api/$id/assets?name=$name" \
                        -H "Content-Type: application/octet-stream" --input "$file" >/dev/null
                    done
                    # GitHub has no conditional upload, so a maintainer publishing
                    # the draft during the seconds between the check above and the
                    # upload cannot be prevented — only detected. Re-check and fail
                    # loudly so a published release with swapped assets is never a
                    # silent green run.
                    if [ "$(gh api "$api/$id" --jq .draft)" != "true" ]; then
                      echo "::error::Release $tag was published while its assets were being replaced; verify the published bundle."
                      exit 1
                    fi
                  fi
